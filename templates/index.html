<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Toolbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 7px;
            padding: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        #ip {
            flex: 3;
        }

        #cidr {
            flex: 1;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #0ea5e9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0284c7;
        }

        .result {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        .result:last-child {
            border-bottom: none;
        }

        .result span:first-child {
            color: #94a3b8;
        }

        .value {
            font-family: monospace;
            font-size: 15px;
        }

        .error {
            color: #f87171;
            margin-top: 15px;
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            background: #334155;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .input-row {
                flex-direction: column;
            }

            .result {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌐 Network Toolbox</h1>
    <p class="subtitle">Simple IPv4 subnet calculator</p>

    <div class="card">

        <label>IP Address / CIDR</label>

        <div class="input-row">
            <input
                id="ip"
                type="text"
                value="192.168.1.100"
                placeholder="192.168.1.100"
            >

            <input
                id="cidr"
                type="number"
                value="24"
                min="0"
                max="32"
                placeholder="24"
            >
        </div>

        <button onclick="calculate()">Calculate Network</button>

        <div id="error" class="error">
            Invalid IP address or CIDR.
        </div>

    </div>


    <div class="card" id="results">

        <div class="result">
            <span>IP Address</span>
            <span class="value" id="resultIP">-</span>
        </div>

        <div class="result">
            <span>Network Address</span>
            <span class="value" id="network">-</span>
        </div>

        <div class="result">
            <span>Subnet Mask</span>
            <span class="value" id="mask">-</span>
        </div>

        <div class="result">
            <span>Broadcast Address</span>
            <span class="value" id="broadcast">-</span>
        </div>

        <div class="result">
            <span>First Usable Host</span>
            <span class="value" id="firstHost">-</span>
        </div>

        <div class="result">
            <span>Last Usable Host</span>
            <span class="value" id="lastHost">-</span>
        </div>

        <div class="result">
            <span>Usable Hosts</span>
            <span class="value" id="hosts">-</span>
        </div>

        <div class="result">
            <span>CIDR</span>
            <span class="value" id="resultCIDR">-</span>
        </div>

        <div class="result">
            <span>IP Type</span>
            <span class="badge" id="type">-</span>
        </div>

        <div class="result">
            <span>Binary IP</span>
            <span class="value" id="binary">-</span>
        </div>

    </div>

</div>


<script>

function ipToInt(ip) {
    const parts = ip.split(".").map(Number);

    return (
        ((parts[0] << 24) >>> 0) +
        ((parts[1] << 16) >>> 0) +
        ((parts[2] << 8) >>> 0) +
        parts[3]
    ) >>> 0;
}


function intToIp(number) {
    return [
        (number >>> 24) & 255,
        (number >>> 16) & 255,
        (number >>> 8) & 255,
        number & 255
    ].join(".");
}


function validIP(ip) {

    const parts = ip.split(".");

    if (parts.length !== 4) {
        return false;
    }

    return parts.every(part => {

        if (part === "" || isNaN(part)) {
            return false;
        }

        const number = Number(part);

        return number >= 0 && number <= 255;
    });
}


function getIPType(parts) {

    const first = parts[0];
    const second = parts[1];

    if (first === 10) {
        return "Private";
    }

    if (first === 172 && second >= 16 && second <= 31) {
        return "Private";
    }

    if (first === 192 && second === 168) {
        return "Private";
    }

    if (first === 127) {
        return "Loopback";
    }

    if (first === 169 && second === 254) {
        return "Link-local";
    }

    if (first >= 224 && first <= 239) {
        return "Multicast";
    }

    return "Public";
}


function calculate() {

    const ip = document.getElementById("ip").value.trim();
    const cidr = Number(document.getElementById("cidr").value);

    const error = document.getElementById("error");

    if (!validIP(ip) || cidr < 0 || cidr > 32) {

        error.style.display = "block";
        return;
    }

    error.style.display = "none";


    const ipInt = ipToInt(ip);

    let mask;

    if (cidr === 0) {
        mask = 0;
    } else {
        mask = (0xFFFFFFFF << (32 - cidr)) >>> 0;
    }


    const network = (ipInt & mask) >>> 0;

    const wildcard = (~mask) >>> 0;

    const broadcast = (network | wildcard) >>> 0;


    let firstHost;
    let lastHost;
    let usableHosts;


    if (cidr === 32) {

        firstHost = ip;
        lastHost = ip;
        usableHosts = 1;

    } else if (cidr === 31) {

        firstHost = intToIp(network);
        lastHost = intToIp(broadcast);
        usableHosts = 2;

    } else {

        firstHost = intToIp((network + 1) >>> 0);
        lastHost = intToIp((broadcast - 1) >>> 0);

        usableHosts = Math.pow(2, 32 - cidr) - 2;
    }


    const binary = ip
        .split(".")
        .map(number =>
            Number(number)
                .toString(2)
                .padStart(8, "0")
        )
        .join(".");


    const parts = ip.split(".").map(Number);


    document.getElementById("resultIP").textContent = ip;

    document.getElementById("network").textContent =
        intToIp(network);

    document.getElementById("mask").textContent =
        intToIp(mask);

    document.getElementById("broadcast").textContent =
        intToIp(broadcast);

    document.getElementById("firstHost").textContent =
        firstHost;

    document.getElementById("lastHost").textContent =
        lastHost;

    document.getElementById("hosts").textContent =
        usableHosts.toLocaleString();

    document.getElementById("resultCIDR").textContent =
        "/" + cidr;

    document.getElementById("type").textContent =
        getIPType(parts);

    document.getElementById("binary").textContent =
        binary;
}


// Calculate example when page loads
calculate();

</script>

</body>
</html>
